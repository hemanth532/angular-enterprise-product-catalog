<mat-toolbar color="primary">
  <span>{{ title() }}</span>
  <span class="spacer"></span>
  <mat-slide-toggle
    [checked]="themeService.activeTheme() === 'material'"
    (change)="themeService.toggleTheme()"
  >
    {{ themeService.activeTheme() | titlecase }}
  </mat-slide-toggle>
</mat-toolbar>

<div class="app-shell">
  <router-outlet></router-outlet>
</div>
