<mat-card class="registration-card">
  <mat-card-title>Register an Account</mat-card-title>
  <mat-card-content>
    <form [formGroup]="registrationForm" (ngSubmit)="submitForm()">
      <mat-form-field appearance="fill">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName" />
        <mat-error *ngIf="submitted && fullName?.hasError('required')">
          Full name is required.
        </mat-error>
        <mat-error *ngIf="submitted && fullName?.hasError('minlength')">
          Full name must be at least 3 characters.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" />
        <mat-error *ngIf="submitted && email?.hasError('required')">
          Email is required.
        </mat-error>
        <mat-error *ngIf="submitted && email?.hasError('email')">
          Enter a valid email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" />
        <mat-error *ngIf="submitted && password?.hasError('required')">
          Password is required.
        </mat-error>
        <mat-error *ngIf="submitted && password?.hasError('minlength')">
          Password must be at least 8 characters.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Confirm Password</mat-label>
        <input matInput type="password" formControlName="confirmPassword" />
        <mat-error *ngIf="submitted && confirmPassword?.hasError('required')">
          Confirm password is required.
        </mat-error>
        <mat-error *ngIf="submitted && registrationForm.hasError('passwordMismatch')">
          Passwords do not match.
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" type="submit">
        Register
      </button>
    </form>
  </mat-card-content>
</mat-card>
